name: Build Standalone llama.cpp

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake (Pure Standalone)
      # -DLLAMA_CURL=OFF যোগ করা হয়েছে যাতে cURL বা OpenSSL (libcrypto) এর দরকার না হয়
      run: cmake -B build -G "Visual Studio 17 2022" -A x64 -DBUILD_SHARED_LIBS=OFF -DLLAMA_CURL=OFF

    - name: Build Only CLI and Server
      run: cmake --build build --config Release --target llama-cli --target llama-server

    - name: Upload Standalone Executables
      uses: actions/upload-artifact@v4
      with:
        name: llama-standalone-exe
        path: |
          build/bin/Release/llama-cli.exe
          build/bin/Release/llama-server.exe
        retention-days: 7
