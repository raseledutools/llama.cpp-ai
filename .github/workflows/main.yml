name: Build llama.cpp for Windows

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # এর মাধ্যমে আপনি চাইলে ম্যানুয়ালিও বিল্ড স্টার্ট করতে পারবেন

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -G "Visual Studio 17 2022" -A x64

    - name: Build Project (Release)
      run: cmake --build build --config Release

    - name: Upload Executables (Artifacts)
      uses: actions/upload-artifact@v4
      with:
        name: llama-cpp-windows-binaries
        path: |
          build/bin/Release/*.exe
          build/bin/Release/*.dll
        retention-days: 7 # ফাইলগুলো ৭ দিন পর্যন্ত গিটহাবে সেভ থাকবে
